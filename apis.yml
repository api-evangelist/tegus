aid: tegus
name: Tegus
url: https://raw.githubusercontent.com/api-evangelist/tegus/refs/heads/main/apis.yml
description: 'Tegus is an investment-research platform for institutional investors, built around an
  expert-call transcript library of more than 260,000 compliance-reviewed 1:1 transcripts covering 27,000+
  public and private companies, alongside company financial models and KPIs, SEC filings, earnings-call
  transcripts and a Tegus Formulas Excel add-in that streams those datapoints into analyst workbooks.
  AlphaSense completed its acquisition of Tegus on 8 July 2024 for approximately $930M, and Tegus now
  operates as a brand inside AlphaSense. The standalone Tegus developer surface has been retired with
  it: the ReadMe-hosted developer hub at tegus.readme.io returns 302 to /inactive, the status page that
  formerly carried an "Our Public API" component no longer resolves, and no OpenAPI, GraphQL SDL, MCP
  server or agent card is published at any tegus.com or tegus.co host. The only live machine-readable
  documents in the namespace are the OpenID Connect discovery, RFC 8414 authorization-server metadata
  and JWKS served by auth.tegus.com. Programmatic access to the Tegus corpus is now delivered through
  the AlphaSense developer platform, profiled separately in this network.'
