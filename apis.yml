apis:
- aid: tegus:identity
  name: Tegus Identity (OpenID Connect)
  description: The OpenID Connect / OAuth 2.0 authorization server that fronts sign-in for the Tegus
    platform. It is an Auth0 tenant operated by AlphaSense (DNS CNAMEs to tegus.alphasense.auth0app.com)
    and it publishes live, anonymous OIDC Discovery 1.0 and RFC 8414 metadata plus a JWKS. It advertises
    the authorization-code, client-credentials, device-code, refresh-token and token-exchange grants,
    PKCE, DPoP, dynamic client registration, CIBA and back-channel logout. It is the identity layer
    of the platform, not a product data API — no Tegus resource API contract is published anywhere public.
  humanURL: https://auth.tegus.com/.well-known/openid-configuration
